# configs/model/default.yaml
defaults:
  - architecture: test
  - tokenizer: default
  - peft: lora
  - quantization: 4bit
  - _self_

model_name: ???
finetuning_type: "peft"
compile: false

# Имя модели в MLflow Registry — читается в mlflow_registry.py как cfg.model.mlflow_model_name
# Не передаётся в HFModelBuilder (не его параметр)
mlflow_model_name: ???

lora_resume:
  enabled: false
  run_id: "016da64e82834cf8918c9f1dfbc4ce19"
  artifact_path: "lora_weights"

builder:
  _target_: src.core.models.builder.HFModelBuilder
  model_name_or_path: ${model.model_name}
  cache_dir: "${paths.hf_cache_dir}"
  auto_model_class: "transformers.AutoModelForCausalLM"
  trust_remote_code: false
  torch_dtype: ${model.architecture.torch_dtype}
  attn_implementation: ${model.architecture.attn_implementation}
  rope_scaling: ${model.architecture.rope_scaling}
  gradient_checkpointing: ${model.architecture.gradient_checkpointing}
  peft_config: ${model.peft}
  quantization_config: ${model.quantization}
  lora_resume_path: null